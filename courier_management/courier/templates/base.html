<!DOCTYPE html>
<html lang="en">
<head>
    <title>Courier Management System</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    .list-group-item.active {
        background-color: #0d6efd !important;
        border-color: #0d6efd !important;
    }

    .list-group-item a {
        display: block;
        width: 100%;
    }

    .feedback-scroll {
        max-height: 500px;
        overflow-y: auto;
    }

    .feedback-card {
        max-width: 70%;
    }
</style>
<style>
    body{
        margin:0;
        min-height:100vh;
        background: #0f172a;
        overflow-x:hidden;
        position: relative;
        font-family: Arial, sans-serif;
    }

    /* Animated Wave Background */
    .wave-bg{
        position: fixed;
        width: 100%;
        height: 100%;
        top:0;
        left:0;
        z-index:0;
        overflow:hidden;
    }

    .wave{
        position:absolute;
        width:200%;
        height:200px;
        border-radius:43%;
        opacity:0.3;
        animation: waveMove 18s linear infinite;
    }

    .wave1{
        background: #3b82f6;
        bottom:-50px;
        left:-50%;
    }

    .wave2{
        background: #8b5cf6;
        bottom:50px;
        left:-50%;
        animation-duration: 25s;
    }

    .wave3{
        background: #06b6d4;
        bottom:150px;
        left:-50%;
        animation-duration: 30s;
    }

    .wave4{
        background: #10b981;
        bottom:250px;
        left:-50%;
        animation-duration: 35s;
    }

    .wave5{
        background: #f59e0b;
        bottom:350px;
        left:-50%;
        animation-duration: 40s;
    }


    @keyframes waveMove{
        0%{
            transform: translateX(0) rotate(0deg);
        }
        100%{
            transform: translateX(-50%) rotate(360deg);
        }
    }

    /* Glass Sidebar */
    .sidebar{
        width:260px;
        min-height:100vh;
        position:fixed;
        left:0;
        top:0;
        z-index:2;
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(12px);
        box-shadow: 4px 0 20px rgba(0,0,0,0.2);
        color:white;
        padding:20px;
    }

    .sidebar a{
        display:block;
        color:white;
        text-decoration:none;
        padding:12px;
        border-radius:12px;
        margin-bottom:10px;
        transition:0.3s;
    }

    .sidebar a:hover{
        background: rgba(255,255,255,0.15);
        transform: translateX(6px);
    }

    /* Main Content */
    .content{
        margin-left:280px;
        padding:30px;
        position:relative;
        z-index:2;
        color:white;
    }

    /* Glass Cards */
    .glass-card{
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(10px);
        border-radius:20px;
        padding:25px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        transition:0.3s;
    }

    .glass-card:hover{
        transform: translateY(-5px);
        box-shadow: 0 12px 25px rgba(0,0,0,0.3);
    }
</style>
</head>
<body class="bg-light">

    <div class="wave-bg">
    <div class="wave wave1"></div>
    <div class="wave wave2"></div>
    <div class="wave wave3"></div>
    <div class="wave wave4"></div>
    <div class="wave wave5"></div>

</div>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark px-3">
        <button class="btn btn-outline-light" type="button" title="Toggle navigation menu"
                data-bs-toggle="offcanvas"
                data-bs-target="#sidebarMenu">
            ☰ Menu
        </button>

        <span class="navbar-brand">Courier Management System</span>
    </nav>

    <!-- Sidebar for ALL Links -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
        <div class="offcanvas-header bg-dark text-white">
            <h5>User Panel</h5>
            <button  type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="offcanvas"
                    title="Close menu"></button>
        </div>

        <div class="offcanvas-body">
    <ul class="list-group">

        <li class="list-group-item {% if request.path == '/dashboard/' %}active{% endif %}">
            <a href="{% url 'dashboard' %}" 
               class="text-decoration-none {% if request.path == '/dashboard/' %}text-white{% endif %}">
                Dashboard
            </a>
        </li>

        <li class="list-group-item {% if request.path == '/profile/' %}active{% endif %}">
            <a href="{% url 'profile' %}" 
               class="text-decoration-none {% if request.path == '/profile/' %}text-white{% endif %}">
                Profile
            </a>
        </li>

        <li class="list-group-item {% if request.path == '/add-package/' %}active{% endif %}">
            <a href="{% url 'add_package' %}" 
                class="text-decoration-none {% if request.path == '/add-package/' %}text-white{% endif %}">
                Add Package
            </a>
        </li>

        <li class="list-group-item {% if request.path == '/packages/' %}active{% endif %}">
            <a href="{% url 'packages' %}" 
               class="text-decoration-none {% if request.path == '/packages/' %}text-white{% endif %}">
                My Packages
            </a>
        </li>
        <li class="list-group-item {% if request.path == '/track-package/' %}active{% endif %}">
            <a href="{% url 'track_package' %}" 
            class="text-decoration-none {% if request.path == '/track-package/' %}text-white{% endif %}">
                Track Package
            </a>
        </li>
        <li class="list-group-item {% if request.path == '/feedback/' %}active{% endif %}">
            <a href="{% url 'feedback' %}" 
            class="text-decoration-none {% if request.path == '/feedback/' %}text-white{% endif %}">
                Feedback & Ratings
            </a>
        </li>

        <li class="list-group-item">
            <a href="{% url 'logout' %}" class="text-decoration-none">
                Logout
            </a>
        </li>

    </ul>
</div>
    </div>

    <!-- Main Page Content -->
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
