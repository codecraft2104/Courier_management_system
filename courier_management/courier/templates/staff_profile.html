{% extends 'staff_base.html' %}

{% block content %}

<h2 class="mb-4">👤 My Profile</h2>

<div class="card shadow p-4 border-0 rounded-4">

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="row">

            <div class="col-md-4 text-center mb-4">
                {% if staff.profile_image %}
                    <img src="{{ staff.profile_image.url }}"
                         class="rounded-circle mb-3"
                         style="width:150px; height:150px; object-fit:cover;">
                {% else %}
                    <img src="https://via.placeholder.com/150"
                         class="rounded-circle mb-3">
                {% endif %}

                <input type="file"
                       name="profile_image"
                       class="form-control">
            </div>

            <div class="col-md-8">

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text"
                           class="form-control"
                           value="{{ request.user.username }}"
                           readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Staff ID</label>
                    <input type="text"
                           class="form-control"
                           value="{{ staff.staff_id }}"
                           readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email"
                        name="email"
                        value="{{ staff.email }}"
                        class="form-control"
                        
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="text"
                           name="phone"
                           value="{{ staff.phone }}"
                           pattern="[6-9]{1}[0-9]{9}"
                        maxlength="10"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <textarea name="address"
                              class="form-control"
                              rows="3">{{ staff.address }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">City</label>
                    <input type="text"
                           name="city"
                           value="{{ staff.city }}"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <input type="text"
                           name="role"
                           value="{{ staff.role }}"
                           class="form-control">
                </div>

                <button type="submit"
                        class="btn btn-primary">
                    Save Profile
                </button>

            </div>
        </div>

    </form>

</div>

{% endblock %}
