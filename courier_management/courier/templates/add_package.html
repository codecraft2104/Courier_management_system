{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow p-4">
        <h3>Add Package</h3>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <h5 class="mt-3">Sender Details</h5>

            <div class="mb-3">
                <label>Sender Name</label>
                <input type="text" name="sender_name" class="form-control" required >
            </div>

            <div class="mb-3">
                <label>Sender Address</label>
                <textarea name="sender_address" class="form-control" required></textarea>
            </div>

            <div class="mb-3">
                <label>Sender Phone</label>
                <input type="text" name="sender_phone" class="form-control" required pattern="[6-9]{1}[0-9]{9}" maxlength="10" >
            </div>

            <h5 class="mt-3">Receiver Details</h5>

            <div class="mb-3">
                <label>Receiver Name</label>
                <input type="text" name="receiver_name" class="form-control" required >
            </div>

            <div class="mb-3">
                <label>Receiver Address</label>
                <textarea name="receiver_address" class="form-control" required ></textarea>
            </div>

            <div class="mb-3">
                <label>Receiver Phone</label>
                <input type="text" name="receiver_phone" class="form-control" required pattern="[6-9]{1}[0-9]{9}" maxlength="10" >
            </div>

            <div class="mb-3">
                <label>Package Weight (kg)</label>
                <input type="number" step="0.01" name="package_weight" class="form-control" required >
            </div>

            <div class="mb-3">
                <label>Package Image</label>
                <input type="file" name="package_image" class="form-control" >
            </div>

            <button type="submit" class="btn btn-primary">
                Add Package
            </button>
        </form>
    </div>
</div>
{% endblock %}
