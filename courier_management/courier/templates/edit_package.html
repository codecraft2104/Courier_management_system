{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow p-4">
        <h3>Edit Package</h3>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <h5>Sender Details</h5>

            <input type="text" name="sender_name"
                   class="form-control mb-3"
                   value="{{ package.sender_name }}" required placeholder="Sender Name">

            <textarea name="sender_address"
                      class="form-control mb-3"
                      required placeholder="Sender Address">{{ package.sender_address }}</textarea>

            <input type="text" name="sender_phone"
                   class="form-control mb-3"
                   value="{{ package.sender_phone }}" required placeholder="Sender Phone">

            <h5>Receiver Details</h5>

            <input type="text" name="receiver_name"
                   class="form-control mb-3"
                   value="{{ package.receiver_name }}" required placeholder="Receiver Name">

            <textarea name="receiver_address"
                      class="form-control mb-3"
                      required placeholder="Receiver Address">{{ package.receiver_address }}</textarea>

            <input type="text" name="receiver_phone"
                   class="form-control mb-3"
                   value="{{ package.receiver_phone }}" required placeholder="Receiver Phone">

            <input type="number" step="0.01"
                   name="package_weight"
                   class="form-control mb-3"
                   value="{{ package.package_weight }}" required placeholder="Package Weight"   >

            <input type="file" name="package_image"
                   class="form-control mb-3"
                   placeholder="Package Image">

            <button type="submit" class="btn btn-success">
                Update Package
            </button>
        </form>
    </div>
</div>
{% endblock %}
