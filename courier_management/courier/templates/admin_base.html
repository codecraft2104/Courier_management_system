<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Panel</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

   
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body{
            background:#f5f7fb;
        }

        .sidebar{
            width:260px;
            height:100vh;
            background:#111827;
            position:fixed;
            left:0;
            top:0;
            padding:20px;
        }

        .sidebar a{
            color:white;
            text-decoration:none;
            display:block;
            padding:12px;
            border-radius:8px;
            margin-bottom:8px;
            transition:0.3s;
        }

        .sidebar a:hover{
            background:#1f2937;
        }

        .main-content{
            margin-left:280px;
            padding:30px;
            position:relative;
            z-index:1;
        }

        .dashboard-card{
            border:none;
            border-radius:15px;
            box-shadow:0 4px 15px rgba(0,0,0,0.08);
        }

        .quick-btn{
            border-radius:10px;
            padding:12px 20px;
        }
    </style>
    <style>
    body{
        margin: 0;
        min-height: 100vh;
        background: #0f172a;
        overflow-x: hidden;
        position: relative;
        font-family: Arial, sans-serif;
    }

    .animated-bg{
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: hidden;
    }

    .blob{
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.5;
        animation: moveBlob 12s infinite alternate ease-in-out;
    }

    .blob1{
        width: 300px;
        height: 300px;
        background: #3b82f6;
        top: 10%;
        left: 10%;
    }

    .blob2{
        width: 250px;
        height: 250px;
        background: #8b5cf6;
        top: 50%;
        left: 70%;
        animation-duration: 15s;
    }

    .blob3{
        width: 200px;
        height: 200px;
        background: #06b6d4;
        top: 70%;
        left: 20%;
        animation-duration: 18s;
    }

    .blob4{
        width: 350px;
        height: 350px;
        background: #ec4899;
        top: 20%;
        left: 60%;
        animation-duration: 20s;
    }

    @keyframes moveBlob{
        0%{
            transform: translate(0,0) scale(1);
        }
        50%{
            transform: translate(50px,-40px) scale(1.1);
        }
        100%{
            transform: translate(-30px,50px) scale(0.95);
        }
    }

    .sidebar{
        position: fixed;
        width: 260px;
        height: 100vh;
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(12px);
        z-index: 2;
        padding: 20px;
        color: white;
    }

    .content{
        margin-left: 280px;
        padding: 30px;
        position: relative;
        z-index: 2;
        color: white;
    }

    .sidebar a{
        display: block;
        color: white;
        text-decoration: none;
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 12px;
        transition: 0.3s;
    }

    .sidebar a:hover{
        background: rgba(255,255,255,0.15);
        transform: translateX(5px);
    }
    a{
        font-weight: bold;
    }
</style>
</head>
<body>
    <div class="animated-bg">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
    <div class="blob blob4"></div>
</div>

    <div class="sidebar">
    <h3 class="text-white mb-4" style="font-weight: bold;">Admin Panel</h3>

    <a href="{% url 'admin_dashboard' %}">Dashboard</a>   
    <a href="{% url 'manage_users' %}">Manage Users</a>
    <a href="{% url 'admin_packages' %}">Manage Packages</a>
    <a href="{% url 'assign_package_list' %}">Assigned Packages</a>
    <a href="{% url 'add_staff' %}" >Add Staff</a>
    <a href="{% url 'manage_staff' %}" >Manage Staff</a>
    <a href="{% url 'feedback_list' %}">Feedback Management</a>
    <a href="{% url 'staff_chat_list' %}">Internal Chat</a>
    <a href="{% url 'logout' %}">Logout</a>
</div>
<div class="main-content">
    {% block content %}
        {% endblock %}
</div>

   
</div>
</div>

</body>
</html>
