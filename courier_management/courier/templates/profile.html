{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">
    <div class="card shadow p-4">
        <h3 class="mb-4">My Profile</h3>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="text-center mb-3">
                {% if profile.profile_image %}
                    <img src="{{ profile.profile_image.url }}"
                         width="120"
                         height="120"
                         class="rounded-circle border" alt="Profile Image"> 
                {% else %}
                    <img src="/media/defaults/default-user.png"
                         width="120"
                         height="120"
                         class="rounded-circle border" alt="Default User">
                {% endif %}
            </div>

            <div class="mb-3">
                <label>Username</label>
                <input type="text"
                       name="username"
                       class="form-control"
                       value="{{ request.user.username }}"
                       required placeholder="Username">
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email"
                       name="email"
                       class="form-control"
                       value="{{ request.user.email }}"
                       required placeholder="Email">
            </div>

            <div class="mb-3">
                <label>Phone</label>
                <input type="text"
                       name="phone"
                       class="form-control"
                       value="{{ profile.phone }}"
                       pattern="[6-9]{1}[0-9]{9}"
                        maxlength="10"
                       placeholder="Phone">
            </div>

            <div class="mb-3">
                <label>Address</label>
                <textarea name="address"
                          class="form-control"
                          placeholder="Address  ">{{ profile.address }}</textarea>
            </div>

            <div class="mb-3">
                <label>City</label>
                <input type="text"
                       name="city"
                       class="form-control"
                       value="{{ profile.city }}"
                       placeholder="City">
            </div>

            <div class="mb-3">
                <label>Pincode</label>
                <input type="text"
                       name="pincode"
                       class="form-control"
                       value="{{ profile.pincode }}" placeholder="Pincode">
            </div>

            <div class="mb-3">
                <label>Profile Image</label>
                <input type="file"
                       name="profile_image"
                       class="form-control"
                       placeholder="Profile Image">
            </div>

            <button type="submit" class="btn btn-primary">
                Update Profile
            </button>
        </form>
    </div>
</div>
{% endblock %}
