{% extends 'admin_base.html' %}

{% block content %}
<div class="card shadow p-4">
    <h3>Delete Staff</h3>

    <p>
        Are you sure you want to delete
        <strong>{{ staff.user.username }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">
            Confirm Delete
        </button>

        <a href="{% url 'manage_staff' %}"
           class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
