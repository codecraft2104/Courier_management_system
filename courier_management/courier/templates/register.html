<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            min-height:100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .register-container{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            animation: fadeIn 1s ease;
        }

        .register-card{
            width: 1000px;
            border-radius: 20px;
            overflow:hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            background:white;
            animation: slideUp 0.8s ease;
        }

        .left-side{
            padding: 40px;
        }

        .right-side{
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .right-side img{
            width:80%;
            animation: floatImage 3s infinite;
        }

        .btn-register:hover{
            transform: scale(1.03);
            transition: 0.3s;
        }

        @keyframes slideUp{
            from{transform: translateY(50px); opacity:0;}
            to{transform: translateY(0); opacity:1;}
        }

        @keyframes fadeIn{
            from{opacity:0;}
            to{opacity:1;}
        }

        @keyframes floatImage{
            0%{transform: translateY(0);}
            50%{transform: translateY(-10px);}
            100%{transform: translateY(0);}
        }
        
    body{
        min-height:100vh;
        overflow:hidden;
        position: relative;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    #particles-js{
        position: fixed;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: 0;
    }

    .login-container,
    .register-container{
        position: relative;
        z-index: 2;
    }

    .login-card,
    .register-card{
        position: relative;
        z-index: 2;
    }

    </style>
</head>
<body>
<div id="particles-js"></div>
<div class="container register-container">
    <div class="row register-card">

        <div class="col-md-6 left-side">
            <h2 class="text-center mb-4">Create Account</h2>

            <form method="POST">
                {% csrf_token %}

                <input type="text" name="username" class="form-control mb-3" placeholder="Username" required>
                <input type="email" name="email" class="form-control mb-3" placeholder="Email" required>
                <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>
                <input type="text" name="phone" class="form-control mb-3" placeholder="Phone" pattern="[6-9]{1}[0-9]{9}" maxlength="10" required>
                <textarea name="address" class="form-control mb-3" placeholder="Address"></textarea>
                <input type="text" name="city" class="form-control mb-3" placeholder="City">
                <input type="text" name="pincode" class="form-control mb-3" placeholder="Pincode">

                <button type="submit"
                        class="btn btn-success w-100 btn-register">
                    Register
                </button>
            </form>
            <div class="text-center mt-3">
                    <a href="/">Already have an account? Login</a>
                </div>
        </div>

        <div class="col-md-6 right-side">
            <img src="https://cdn-icons-png.flaticon.com/512/4117/4117630.png">
        </div>

    </div>
</div>
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
particlesJS("particles-js", {
    particles: {
        number: {
            value: 80,
            density: {
                enable: true,
                value_area: 800
            }
        },
        color: {
            value: "#ffffff"
        },
        shape: {
            type: "circle"
        },
        opacity: {
            value: 0.5
        },
        size: {
            value: 3,
            random: true
        },
        line_linked: {
            enable: true,
            distance: 150,
            color: "#ffffff",
            opacity: 0.4,
            width: 1
        },
        move: {
            enable: true,
            speed: 3
        }
    },

    interactivity: {
        detect_on: "canvas",
        events: {
            onhover: {
                enable: true,
                mode: "repulse"
            },
            onclick: {
                enable: true,
                mode: "push"
            }
        },
        modes: {
            repulse: {
                distance: 100
            },
            push: {
                particles_nb: 4
            }
        }
    },

    retina_detect: true
});
</script>
</body>
</html>
