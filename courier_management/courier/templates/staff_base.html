<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        
    body{
        min-height: 100vh;
        background: linear-gradient(-45deg, #667eea, #764ba2, #6a11cb, #2575fc);
        background-size: 400% 400%;
        animation: gradientMove 12s ease infinite;
        overflow-x: hidden;
    }

    @keyframes gradientMove {
        0%{
            background-position: 0% 50%;
        }
        50%{
            background-position: 100% 50%;
        }
        100%{
            background-position: 0% 50%;
        }
    }

    .sidebar{
        background: rgba(0,0,0,0.75);
        backdrop-filter: blur(8px);
    }

    .content{
        position: relative;
        z-index: 2;
    }
        .sidebar {
            width: 260px;
            min-height: 100vh;
            background: #1e293b;
            color: white;
        }

        .sidebar a {
            color: #cbd5e1;
            padding: 12px 15px;
            display: block;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .sidebar a:hover {
            background: #334155;
            color: white;
        }

        .content {
            flex: 1;
            padding: 30px;
        }

        .card-box {
            border: none;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
     
    .bubbles{
        position: fixed;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: 0;
        overflow: hidden;
    }

    .bubbles span{
        position: absolute;
        display: block;
        width: 40px;
        height: 40px;
        background: rgba(255,255,255,0.15);
        border-radius: 50%;
        animation: floatUp 15s linear infinite;
        bottom: -150px;
    }

    .bubbles span:nth-child(1){
        left: 10%;
        width: 60px;
        height: 60px;
        animation-duration: 12s;
    }

    .bubbles span:nth-child(2){
        left: 30%;
        animation-duration: 18s;
    }

    .bubbles span:nth-child(3){
        left: 50%;
        width: 70px;
        height: 70px;
    }

    .bubbles span:nth-child(4){
        left: 70%;
        animation-duration: 20s;
    }

    .bubbles span:nth-child(5){
        left: 90%;
        width: 50px;
        height: 50px;
    }

    @keyframes floatUp{
        0%{
            transform: translateY(0) scale(1);
            opacity: 0.5;
        }
        100%{
            transform: translateY(-1200px) scale(1.5);
            opacity: 0;
        }
    }
    </style>
</head>
<body>

<div class="d-flex">

    <div class="bubbles">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>
    <!-- Sidebar -->
    <div class="sidebar p-4">
        <h4 class="mb-4">🚚 Staff Panel</h4>

        <a href="{% url 'staff_dashboard' %}">Dashboard</a>
        <a href="{% url 'staff_profile' %}">My Profile</a>
        <a href="{% url 'staff_admin_chat' %}">Internal Chat
        {% if unread_admin_count > 0 %}
        <span class="position-absolute  start-100 translate-middle badge rounded-pill bg-danger">
        {{ unread_admin_count }}
        </span>
        {% endif %}
        </a>
        <a href="{% url 'staff_packages' %}">Assigned Packages</a>
        <a href="{% url 'staff_history' %}">Delivery History</a>
        
        <a href="{% url 'logout' %}">Logout</a>
    </div>

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

</div>

</body>
</html>
